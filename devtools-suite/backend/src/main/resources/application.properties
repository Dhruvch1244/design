server.port=8383

# Lives in the user's home directory, not next to the jar — so upgrading to a new release
# (a new extracted folder) doesn't leave history/notes/tasks/saved-queries behind. See
# run.bat for the one-time migration that copies an old next-to-the-jar db into this location.
spring.datasource.url=jdbc:h2:file:${user.home}/.devtools-suite/devtools-history;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browser-upload search still goes through Tomcat multipart handling, so keep this at a size that's
# actually practical to copy over HTTP. For anything bigger, use the local file-path search mode
# (/api/file-search/path), which reads straight off disk and isn't bound by this limit.
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB

# Ceiling for both search modes. Local file-path search is limited only by this value and disk
# speed, so it's set high enough to cover 40GB+ files.
devtools.file-search.max-size-bytes=42949672960
